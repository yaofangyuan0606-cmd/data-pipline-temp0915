<span class="user-menu"><span class="pill on" title="登录名 {{ user.username }}">{{ user.display_name or user.username }} · {{ role_names.get(user.role, user.role) }}</span><a class="btn" href="/account">账号</a>{% if user.role == 'admin' %}<a class="btn" href="/annotate/users">用户管理</a><a class="btn" href="/annotate/logs">运行日志</a>{% endif %}<button type="button" id="logout-btn" title="退出登录">退出</button></span>
<script>document.getElementById("logout-btn").addEventListener("click", async () => { try { await fetch("/api/v1/auth/logout", {method: "POST"}); } catch (_) {} location.href = "/login"; });</script>

<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 切片标注</title>
<link rel="stylesheet" href="/static/style.css?v={{ static_v('style.css') }}">
<link rel="stylesheet" href="/static/login.css?v={{ static_v('login.css') }}">
</head>
<body class="ws-annotate login-body">
<main class="login-shell">
  <section class="login-hero">
    <div class="hero-brand"><span class="logo">AN</span><b>切片标注</b></div>
  </section>

  <section class="login-side">
    <form class="login-card" id="login-form" autocomplete="on" novalidate>
      <h2>登录</h2>
      <label class="fld"><span>登录名</span><input id="login-user" class="mono" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus required maxlength="64"></label>
      <label class="fld"><span>密码</span><div class="pw"><input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="256"><button type="button" class="pw-toggle" id="pw-toggle" aria-label="显示密码">显示</button></div></label>
      <div class="login-error" id="login-error" role="alert" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="login-error-text"></span></div>
      <button type="submit" class="login-btn" id="login-btn"><span class="spin"></span><span class="label">登录</span></button>
      <p class="login-note" id="login-note"></p>
      <p class="login-meta"><span class="mono">{{ settings.deployment_name or "local" }}</span><span class="dot"></span>v{{ version }}</p>
    </form>
  </section>
</main>
<script>
  const next = {{ next|tojson }};
  const form = document.getElementById("login-form"), err = document.getElementById("login-error"), errText = document.getElementById("login-error-text");
  const btn = document.getElementById("login-btn"), note = document.getElementById("login-note"), pass = document.getElementById("login-pass"), toggle = document.getElementById("pw-toggle");
  toggle.addEventListener("click", () => { const show = pass.type === "password"; pass.type = show ? "text" : "password"; toggle.textContent = show ? "隐藏" : "显示"; toggle.setAttribute("aria-label", show ? "隐藏密码" : "显示密码"); pass.focus(); });
  let open = false;
  fetch("/api/v1/auth/status").then(r => r.json()).then(s => {
    if (s.auth_disabled) { location.href = next; return; }
    open = !!s.auth_open;
    if (open) { note.textContent = "试用模式 · 密码暂不校验，填名字即可进入"; note.classList.add("soft"); pass.required = false; }
    else if (s.has_users === false) note.textContent = "这个实例还没有任何账号：请在服务器上运行 python -m emqc create-user --role admin 建第一个管理员。";
  }).catch(() => {});
  function fail(message) {
    errText.textContent = message; err.hidden = false;
    err.classList.remove("shake"); void err.offsetWidth; err.classList.add("shake");
    btn.disabled = false; btn.classList.remove("busy"); pass.focus(); pass.select();
  }
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const username = form.username.value.trim(), password = form.password.value;
    if (!username) { fail("请输入登录名"); form.username.focus(); return; }
    if (!password && !open) { fail("请输入密码"); return; }
    err.hidden = true; btn.disabled = true; btn.classList.add("busy");
    try {
      const r = await fetch("/api/v1/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password})});
      const body = await r.json().catch(() => ({}));
      if (!r.ok) { const d = body.detail; throw new Error(typeof d === "string" ? d : d?.message || `登录失败 (${r.status})`); }
      btn.querySelector(".label").textContent = "正在进入…";
      location.href = body.user?.must_change_password ? "/account?force=1&next=" + encodeURIComponent(next) : next;
    } catch (e) { fail(e.message); }
  });
</script>
</body>
</html>
